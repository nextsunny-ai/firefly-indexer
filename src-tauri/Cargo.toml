[package]
name = "firefly_indexer"
version = "0.1.9"
description = "Adobe Firefly training-data indexer (BYOK via Claude CLI)"
authors = ["Sunny Soft"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "firefly_indexer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
dirs = "5.0"
calamine = "0.24"           # read sample answer-key xlsx for evaluator
rust_xlsxwriter = "0.78"    # write output xlsx
tempfile = "3.10"
regex = "1.10"
walkdir = "2.5"
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
