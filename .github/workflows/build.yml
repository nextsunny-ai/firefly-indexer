name: Cross-platform build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/{nsis/*.exe,msi/*.msi}'
            asset_label: windows-x64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: ${{ matrix.platform.target }}

      - name: Install npm deps
        run: npm ci

      # ── Bundle the Gemini engine INTO the app ─────────────────────────
      # Ships a Node.js runtime + the Gemini CLI inside the app itself, so
      # users never install anything for the Gemini engine — only a
      # one-time browser login. NODE_VER is pinned for reproducibility.
      - name: Bundle Gemini runtime (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "22.12.0"
          $gem = "src-tauri/resources/gem"
          New-Item -ItemType Directory -Force -Path $gem | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip" -OutFile "$env:TEMP/node.zip"
          Expand-Archive "$env:TEMP/node.zip" -DestinationPath "$env:TEMP/nodex" -Force
          Copy-Item "$env:TEMP/nodex/node-v$ver-win-x64/node.exe" "$gem/node.exe"
          npm install --prefix "$env:TEMP/gem" @google/gemini-cli
          Copy-Item -Recurse "$env:TEMP/gem/node_modules/@google/gemini-cli" "$gem/cli"
          Write-Host "bundled:" (Get-ChildItem -Recurse $gem | Measure-Object).Count "files"

      - name: Bundle Gemini runtime (macOS)
        if: matrix.platform.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          ver=22.12.0
          gem=src-tauri/resources/gem
          mkdir -p "$gem"
          if [ "${{ matrix.platform.target }}" = "aarch64-apple-darwin" ]; then arch=darwin-arm64; else arch=darwin-x64; fi
          curl -fsSL -o /tmp/node.tgz "https://nodejs.org/dist/v$ver/node-v$ver-$arch.tar.gz"
          tar -xzf /tmp/node.tgz -C /tmp
          cp "/tmp/node-v$ver-$arch/bin/node" "$gem/node"
          chmod +x "$gem/node"
          npm install --prefix /tmp/gem @google/gemini-cli
          cp -R /tmp/gem/node_modules/@google/gemini-cli "$gem/cli"
          echo "bundled $(find "$gem" -type f | wc -l) files"

      - name: Build (Tauri)
        run: npx tauri build --target ${{ matrix.platform.target }}

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firefly-indexer-${{ matrix.platform.asset_label }}
          path: ${{ matrix.platform.artifact_glob }}
          if-no-files-found: warn
          retention-days: 14

      - name: Create / update Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.platform.artifact_glob }}
