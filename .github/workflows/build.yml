name: Cross-platform build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/{nsis/*.exe,msi/*.msi}'
            asset_label: windows-x64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: ${{ matrix.platform.target }}

      - name: Install npm deps
        run: npm ci

      - name: Build (Tauri)
        run: npx tauri build --target ${{ matrix.platform.target }}

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firefly-indexer-${{ matrix.platform.asset_label }}
          path: ${{ matrix.platform.artifact_glob }}
          if-no-files-found: warn
          retention-days: 14

      - name: Create / update Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.platform.artifact_glob }}
